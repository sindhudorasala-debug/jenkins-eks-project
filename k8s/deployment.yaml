apiVersion: apps/v1
kind: Deployment

metadata:
  name: cineworld-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cineworld

  template:
    metadata:
      labels:
        app: cineworld

    spec:
      containers:
        - name: cineworld-container
          image: YOUR_ECR_IMAGE_URI

          ports:
            - containerPort: 5000

          readinessProbe:
            httpGet:
              path: /health
              port: 5000

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
