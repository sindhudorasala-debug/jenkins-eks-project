<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CineWorld Movie Hub</title>

    <style>
        body {
            margin: 0;
            background: #101018;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #202030;
            padding: 20px;
            color: #ff5555;
        }

        .hero {
            padding: 60px 20px;
            background: linear-gradient(120deg, #35142c, #17172b);
        }

        .hero h1 {
            font-size: 40px;
        }

        .movies {
            padding: 25px;
        }
       .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie {
            background: #29293b;
            padding: 20px;
            border-radius: 12px;
        }

        .poster {
            background: linear-gradient(135deg, #642b73, #c6426e);
            height: 150px;
            display: grid;
            place-items: center;
            font-size: 50px;
            border-radius: 8px;
        }

        button {
            background: #e94343;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
        }

        input {
            padding: 12px;
            width: 80%;
            max-width: 350px;
        }
    </style>
</head>

<body>

<header>
    <h2>🎬 CineWorld</h2>
</header>

<section class="hero">
    <h1>Welcome to CineWorld</h1>
    <p>Explore your favourite movies!</p>

    <input id="search"
           placeholder="Search movies..."
           onkeyup="searchMovies()">
</section>

<section class="movies">
    <h2>Trending Movies</h2>

    <div class="movie-grid">

        {% for movie in movies %}

        <div class="movie">
            <div class="poster">🎥</div>

            <h3>{{ movie.name }}</h3>

            <p>{{ movie.description }}</p>

            <p>Genre: {{ movie.genre }}</p>

            <p>Year: {{ movie.year }}</p>

            <button onclick="alert('Welcome to CineWorld!')">
                Explore Movie
            </button>
        </div>

        {% endfor %}

    </div>
</section>

<script>
function searchMovies() {
    const value = document.getElementById("search")
        .value.toLowerCase();

    document.querySelectorAll(".movie").forEach(movie => {
        movie.style.display =
            movie.innerText.toLowerCase().includes(value)
            ? "" : "none";
    });
}
</script>

</body>
</html>
